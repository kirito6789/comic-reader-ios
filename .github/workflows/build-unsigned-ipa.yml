name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project ComicReader.xcodeproj \
            -scheme ComicReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R "$RUNNER_TEMP/build/Build/Products/Release-iphoneos/ComicReader.app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ComicReader-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ComicReader-unsigned
          path: ComicReader-unsigned.ipa
          if-no-files-found: error
